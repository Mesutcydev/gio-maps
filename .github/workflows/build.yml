name: Build region packs

on:
  workflow_dispatch:
    inputs:
      regions:
        description: Region ids, comma separated (regions/<id>.json), or "all"
        default: istanbul
        required: true

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.plan.outputs.regions }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          WANTED: ${{ inputs.regions }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import glob, json, os
          known = sorted(os.path.basename(p)[:-5] for p in glob.glob("regions/*.json"))
          wanted = os.environ["WANTED"].strip()
          ids = known if wanted == "all" else [r.strip() for r in wanted.split(",") if r.strip()]
          missing = [r for r in ids if r not in known]
          if missing:
              raise SystemExit(f"unknown regions: {missing}")
          print("regions=" + json.dumps(ids))
          EOF

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.regions) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          curl -fsSL -o /tmp/go-pmtiles.tar.gz https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
          sudo tar -xzf /tmp/go-pmtiles.tar.gz -C /usr/local/bin pmtiles
          pmtiles version

      - name: Self-test places
        run: python3 pipeline/places.py --selftest

      - name: Build
        run: pipeline/build_region.sh regions/${{ matrix.region }}.json out

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(python3 -c 'import json; print(json.load(open("out/pack.json", encoding="utf-8"))["id"])')
          VERSION=$(python3 -c 'import json; print(json.load(open("out/pack.json", encoding="utf-8"))["version"])')
          TAG="$ID-$VERSION"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" out/basemap.pmtiles out/valhalla_tiles.tar out/places.sqlite out/pack.json \
            --title "$ID $VERSION" \
            --notes "Gio offline pack $ID, built $VERSION. Map data © OpenStreetMap contributors (ODbL)."

  catalog:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    concurrency: catalog
    steps:
      - uses: actions/checkout@v4
      - name: Publish catalog.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/catalog.py "$GITHUB_REPOSITORY" catalog.json
          cat catalog.json
          gh release view catalog >/dev/null 2>&1 || gh release create catalog --title "Catalog" --notes "Index of the latest Gio offline packs." --latest=false
          gh release upload catalog catalog.json --clobber
